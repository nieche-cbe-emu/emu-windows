name: build-windows-qt

on:
  workflow_dispatch:
    inputs:
      tag:
        # **留空就不上传。** 以前默认值是一个真实的 tag，手动跑一次构建
        # 就会把那个 release 的附件覆盖掉。
        description: 上传到哪个 release tag（留空＝只构建、不上传）
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nieche-cbe-emu/emu-core-rs
          path: core

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 模拟核心。unicorn 在这里能正常构建——它的 build.rs 用的是
      # Visual Studio 自带的 cmake 与 ninja，runner 上装的 VS 带这些组件。
      # **不要用 bash**：Git 自带的 /usr/bin/link 会挡住 MSVC 的 link.exe，
      # 报的错是 "extra operand ... rcgu.o"，看着像 Rust 的问题，其实是链接器认错了。
      - name: build core dll
        shell: pwsh
        run: |
          cd core
          cargo build --release -p emuffi --lib
          if (-not (Test-Path target/release/nieche.dll)) { throw "nieche.dll 没生成" }
          Get-Item target/release/nieche.dll | Select-Object Length, FullName

      - name: configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DNIECHE_TESTS=ON -DNIECHE_DIR="$PWD/core"

      - name: build
        shell: pwsh
        run: cmake --build build --config Release

      # 按键回归测试（#1：游戏库列表吃掉键盘）。
      # 用 offscreen 平台插件跑，runner 上没有桌面会话也能建窗口、发按键。
      - name: keyboard test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build -C Release -V

      # windeployqt 把 Qt 运行库拷到 exe 旁边，用户解压即用、不需要安装
      - name: deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/NiecheEmu | Out-Null
          Copy-Item build/Release/NiecheEmu.exe dist/NiecheEmu/
          Copy-Item core/target/release/nieche.dll dist/NiecheEmu/
          if (Test-Path build/Release/probe.exe) { Copy-Item build/Release/probe.exe dist/NiecheEmu/ }
          cd dist/NiecheEmu
          windeployqt --release --no-translations --no-system-d3d-compiler NiecheEmu.exe
          Get-ChildItem | Select-Object -ExpandProperty Name

      # 冒烟测试：确认 exe 能起来并把核心加载上。
      # runner 上没有桌面会话，所以只验进程能启动到加载核心这一步。
      # 在**原生 x64** 上跑一次最小探针：LoadLibrary + nieche_selftest。
      # ARM 虚拟机里 x64 模拟下这一步会崩，需要确认真实 Windows 上是否正常。
      - name: probe（原生 x64 上验 JIT）
        shell: pwsh
        run: |
          cd dist/NiecheEmu
          ./probe.exe
          if ($LASTEXITCODE -ne 0) { throw "probe 失败，退出码 $LASTEXITCODE" }

      - name: smoke test
        shell: bash
        run: |
          test -f dist/NiecheEmu/NiecheEmu.exe
          test -f dist/NiecheEmu/nieche.dll
          test -f dist/NiecheEmu/Qt6Widgets.dll
          echo "产物齐全"

      - name: package
        shell: bash
        run: |
          cd dist && 7z a -tzip NiecheEmu-windows-x64.zip NiecheEmu && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: NiecheEmu-windows-x64
          path: dist/*.zip

      - name: attach to release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.zip --clobber
