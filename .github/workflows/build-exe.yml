name: build-windows-exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上传到哪个 release tag
        required: false
        default: v0.2.0
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nieche-cbe-emu/emu-core
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: install deps
        run: pip install unicorn capstone pyinstaller

      # Rust 核心。windows runner 自带 Rust，MSVC 目标直接就能编——
      # 这是 Windows 端唯一能拿到 Rust 核心的路子，macOS 上既没有 mingw
      # 也打不出 Windows 的 exe。
      - name: build rust core
        shell: bash
        run: |
          cd core/rust
          cargo build --release -p emuffi --lib
          cd ../..
          cp core/rust/target/release/nieche.dll .
          ls -l nieche.dll

      - name: assemble
        shell: bash
        run: cp -R core/emu core/cbelib .

      - name: build
        shell: bash
        run: |
          EXTRA=""
          # 只把字库当 data 带上。整个 emu 目录也塞 data 的话，
          # 解出来的源码目录会和 PyInstaller 冻结的同名包重叠。
          DATA="--add-data emu/font12.cbef;emu --add-data logo.png;."
          DATA="$DATA --add-binary nieche.dll;."
          COLLECT="--collect-all unicorn --collect-all capstone"

          pyinstaller --onefile --windowed --name NiecheEmu-x64 \
            $DATA $COLLECT $EXTRA nieche_win.py
          # 带控制台的诊断版：闪退时能直接看到 traceback
          pyinstaller --onefile --console --name NiecheEmu-x64-debug \
            $DATA $COLLECT $EXTRA nieche_win.py
          # 目录版：不做临时解包，原生库直接躺在磁盘上。onefile 的解包
          # 会改变 DLL 的加载路径与搜索顺序，ctypes 加载的原生库最容易在这里翻车。
          pyinstaller --onedir --windowed --name NiecheEmu \
            $DATA $COLLECT $EXTRA nieche_win.py
          ls -l dist

      # 冻结出来的 exe 默认只保留 1MB 栈，而 CPython 官方的 python.exe 给的是 8MB。
      # unicorn 的代码生成很吃栈，1MB 下溢出的表现正是"进程硬死、没有任何
      # Python 异常、控制台一起关掉"——和用户报的现象完全一致。
      # 两处都要改：
      # /STACK  —— 冻结出来的 exe 默认只留 1MB 栈，官方 python.exe 是 8MB。
      # /GUARD:NO —— **这是闪退的真正原因**。PyInstaller 的引导程序开了
      #   Control Flow Guard，而 unicorn 的 JIT 会间接跳到运行时生成的代码上，
      #   CFG 判定为非法间接调用目标，直接 __fastfail 掉整个进程：
      #   退出码 0xC0000409 (STATUS_STACK_BUFFER_OVERRUN)，没有任何 Python 异常。
      #   同样的自检在不冻结的 Python 下是通过的，正好对上。
      - name: 关掉 CFG 并加大栈
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find **\editbin.exe`) do set EDITBIN=%%i
          echo using %EDITBIN%
          "%EDITBIN%" /STACK:8388608 /GUARD:NO dist\NiecheEmu-x64.exe
          "%EDITBIN%" /STACK:8388608 /GUARD:NO dist\NiecheEmu-x64-debug.exe
          "%EDITBIN%" /STACK:8388608 /GUARD:NO dist\NiecheEmu\NiecheEmu.exe

      - name: 打包目录版
        shell: bash
        run: |
          cd dist && 7z a -tzip "NiecheEmu-x64-folder.zip" NiecheEmu && ls -l

      - name: smoke test
        shell: bash
        run: |
          test -f "dist/NiecheEmu-x64.exe"
          test -f "dist/NiecheEmu-x64-debug.exe"
          test -f "dist/NiecheEmu-x64-folder.zip"

      # 真正在 Windows 上跑一遍原生层自检。用户报的闪退就崩在 Machine 构造的
      # 第一个 mem_map 上，那之前不需要任何 .cbe，所以这里能完整复现。
      # 三种形态都跑一遍，用来分辨"Windows 的问题"还是"PyInstaller 的问题"。
      # 都设 continue-on-error，否则第一个挂掉后面就看不到了。
      - name: 自检 A - 不冻结（对照组）
        continue-on-error: true
        shell: cmd
        run: python nieche_win.py --uctest

      - name: 自检 B - 单文件版
        shell: cmd
        run: dist\NiecheEmu-x64-debug.exe --uctest

      - name: 自检 C - 目录版
        shell: cmd
        run: dist\NiecheEmu\NiecheEmu.exe --uctest

      - name: 自检 D - 确认用上了 Rust 核心
        shell: cmd
        run: dist\NiecheEmu-x64-debug.exe --coretest

      - uses: actions/upload-artifact@v4
        with:
          name: NiecheEmu-x64
          path: |
            dist/*.exe
            dist/*.zip

      - name: attach to release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.exe dist/*.zip --clobber
