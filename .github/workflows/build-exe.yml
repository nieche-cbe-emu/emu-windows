name: build-windows-exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上传到哪个 release tag
        required: false
        default: v0.1.0
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # arm64 卡在上游：unicorn 在 Windows/ARM64 上的构建还不成熟。
    # 它失败不该拖垮 x64 的产出。
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nieche-cbe-emu/emu-core
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      # PyPI 上没有 win_arm64 的 unicorn / capstone 轮子，pip 会转去源码编译，
      # 而裸的 runner 上 cmake 找不到 MSVC。先把编译环境准备好。
      - name: setup msvc (arm64)
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: install deps (x64)
        if: matrix.arch == 'x64'
        run: pip install unicorn capstone pyinstaller

      # win_arm64 没有现成轮子，而 unicorn 的 setup.py 把生成器写死成 -A x64，
      # 从源码装也不行。所以：先取 x64 轮子拿到**纯 Python 的 ctypes 绑定**，
      # 再自己用 cmake 编 ARM64 的 DLL 覆盖进去。两个绑定都只靠 ctypes 加载
      # 动态库，换掉 DLL 就等于换了架构。
      - name: install deps (arm64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          pip install pyinstaller
          pip install --only-binary=:all: --platform win_amd64               --python-version 311 --no-deps --target pylibs unicorn capstone

          git clone --depth 1 -b 5.0.3 https://github.com/capstone-engine/capstone.git cs
          cmake -S cs -B cs/b -A ARM64 -DCMAKE_BUILD_TYPE=Release                 -DBUILD_SHARED_LIBS=ON -DCAPSTONE_BUILD_CSTOOL=OFF                 -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_ARM_SUPPORT=ON
          cmake --build cs/b --config Release
          cp cs/b/Release/capstone.dll pylibs/capstone/lib/capstone.dll

          git clone --depth 1 -b 2.1.3 https://github.com/unicorn-engine/unicorn.git uc
          cmake -S uc -B uc/b -A ARM64 -DCMAKE_BUILD_TYPE=Release                 -DBUILD_SHARED_LIBS=ON -DUNICORN_ARCH=arm -DUNICORN_BUILD_TESTS=OFF
          cmake --build uc/b --config Release
          cp uc/b/Release/unicorn.dll pylibs/unicorn/lib/unicorn.dll

          python -c "import sys; sys.path.insert(0,'pylibs'); import unicorn, capstone; print('绑定可加载')"

      - name: assemble
        shell: bash
        run: cp -R core/emu core/cbelib .

      - name: build
        shell: bash
        env:
          PYTHONPATH: pylibs
        run: |
          EXTRA=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then EXTRA="--paths pylibs"; fi
          # 只把字库当 data 带上。整个 emu 目录也塞 data 的话，
          # 解出来的源码目录会和 PyInstaller 冻结的同名包重叠。
          DATA="--add-data emu/font12.cbef;emu --add-data logo.png;."
          COLLECT="--collect-all unicorn --collect-all capstone"

          pyinstaller --onefile --windowed --name NiecheEmu-${{ matrix.arch }} \
            $DATA $COLLECT $EXTRA nieche_win.py
          # 带控制台的诊断版：闪退时能直接看到 traceback
          pyinstaller --onefile --console --name NiecheEmu-${{ matrix.arch }}-debug \
            $DATA $COLLECT $EXTRA nieche_win.py
          # 目录版：不做临时解包，原生库直接躺在磁盘上。onefile 的解包
          # 会改变 DLL 的加载路径与搜索顺序，ctypes 加载的原生库最容易在这里翻车。
          pyinstaller --onedir --windowed --name NiecheEmu \
            $DATA $COLLECT $EXTRA nieche_win.py
          ls -l dist

      # 冻结出来的 exe 默认只保留 1MB 栈，而 CPython 官方的 python.exe 给的是 8MB。
      # unicorn 的代码生成很吃栈，1MB 下溢出的表现正是"进程硬死、没有任何
      # Python 异常、控制台一起关掉"——和用户报的现象完全一致。
      - name: 加大栈
        if: matrix.arch == 'x64'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find **\editbin.exe`) do set EDITBIN=%%i
          echo using %EDITBIN%
          "%EDITBIN%" /STACK:8388608 dist\NiecheEmu-x64.exe
          "%EDITBIN%" /STACK:8388608 dist\NiecheEmu-x64-debug.exe
          "%EDITBIN%" /STACK:8388608 dist\NiecheEmu\NiecheEmu.exe

      - name: 打包目录版
        shell: bash
        run: |
          cd dist && 7z a -tzip "NiecheEmu-${{ matrix.arch }}-folder.zip" NiecheEmu && ls -l

      - name: smoke test
        shell: bash
        run: |
          test -f "dist/NiecheEmu-${{ matrix.arch }}.exe"
          test -f "dist/NiecheEmu-${{ matrix.arch }}-debug.exe"
          test -f "dist/NiecheEmu-${{ matrix.arch }}-folder.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NiecheEmu-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: attach to release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.exe dist/*.zip --clobber
